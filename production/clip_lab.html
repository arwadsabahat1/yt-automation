<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Review — owned footage pilot</title><style>
@font-face{font-family:Montserrat;src:url('/media/Montserrat.ttf');font-weight:100 900}
*{box-sizing:border-box}body{overflow-x:hidden;margin:0;background:#122335;color:#f0f3f6;font-family:Montserrat,Arial,sans-serif;padding:34px 54px 190px}button,input,textarea{font:inherit}button,a.download{border:0;background:#ffd400;color:#122335;padding:16px 22px;border-radius:6px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#2c4357;color:#fff}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #435666;padding-bottom:22px}header strong{font-size:34px}header span{font-size:23px;color:#b4c1cd}nav{display:flex;gap:12px;margin:25px 0}nav button{font-size:22px;padding:13px 20px}h1{font-size:48px;margin:18px 0 10px;letter-spacing:-1px}p.sub{font-size:24px;color:#b4c1cd;margin:0 0 22px}.workspace>section,.workspace>aside{min-width:0}.workspace{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(500px,.85fr);gap:36px}.player{background:#09131d;min-height:510px;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden}video{max-width:100%;max-height:540px}.panel{background:#1c3347;padding:24px;border-radius:8px}.panel h2{font-size:32px;margin:0 0 18px}.row{font-size:27px;padding:13px 0;border-bottom:1px solid #435666;line-height:1.35}.row.selected{color:#ffd400;font-weight:700}.row small{display:block;font-size:19px;color:#b4c1cd;margin-bottom:6px}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:20px;font-size:25px}.controls input{width:145px;padding:9px;background:#122335;color:#f0f3f6;border:2px solid #647686;border-radius:5px}.help{font-size:24px;line-height:1.5;color:#c7d3dd;margin:20px 0 0}.twoup{display:grid;grid-template-columns:1fr 1fr;gap:30px;max-width:1300px;margin:auto}.phone{height:550px;display:flex;justify-content:center;background:#09131d;border-radius:8px}.phone video{height:550px;max-height:550px;max-width:100%}.twoup h2{font-size:30px;margin:0 0 12px}.twoup p{font-size:22px;color:#b4c1cd;margin:12px 0}.notice{font-size:22px;color:#b4c1cd;margin-top:20px}.metric{display:flex;justify-content:space-between;gap:18px;font-size:28px;padding:17px 0;border-bottom:1px solid #435666}.metric strong{color:#ffd400}textarea{width:100%;height:235px;padding:15px;background:#122335;color:#f0f3f6;border:2px solid #647686;font-size:25px;line-height:1.5;resize:none}label.check{display:block;font-size:25px;margin:15px 0}input[type=checkbox]{width:25px;height:25px;accent-color:#ffd400}#log{font-size:21px;color:#b4c1cd;margin-top:24px}#episode{display:none}.delivery{display:grid;grid-template-columns:2fr 1fr;gap:28px}.delivery video{width:100%;max-height:660px}.delivery a{margin:12px 0}.shorts{display:flex;gap:14px;flex-wrap:wrap}.shorts video{height:330px;width:186px}body.portrait{padding:35px 45px 380px}body.portrait header span{font-size:24px;max-width:450px;text-align:right}body.portrait h1{font-size:55px}body.portrait nav{gap:10px;flex-wrap:wrap}body.portrait nav button{font-size:28px}body.portrait .workspace{grid-template-columns:1fr;gap:22px}body.portrait .player{min-height:470px}body.portrait video{max-height:510px}body.portrait .row{font-size:46px}body.portrait textarea{font-size:42px;height:360px}body.portrait .row:nth-child(n+4){display:none}body.portrait .twoup{gap:20px}body.portrait .phone{height:650px}body.portrait .phone video{height:650px;max-height:650px}body.portrait .notice{font-size:28px}body.portrait .help{font-size:28px}body.portrait .metric{font-size:34px}body.portrait .controls{font-size:29px}
</style></head><body><header><strong>CLIP REVIEW</strong><span>Owned practice footage · local review tool</span></header>
<nav><button class="secondary" onclick="show('source')">Source</button><button class="secondary" onclick="show('selection')">Selection</button><button class="secondary" onclick="show('compare')">Framing</button><button class="secondary" onclick="show('captions')">Captions</button><button class="secondary" onclick="show('report')">File check</button><button class="secondary" onclick="show('episode')">Full episode</button></nav>
<main id="main"></main><p id="log">Local review. No posting account connected.</p>
<script>
let data,view='source',start,end;const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function player(src,id='video',loop=false){const muted=/^(episode|short-\d)\.mp4$/.test(src)?'':'muted';return `<video id="${id}" src="/media/${src}" controls ${muted} playsinline ${loop?'loop':''}></video>`}
function log(s){el('log').textContent=s}
function play(id='video',at=null){const v=el(id);if(!v)return;if(at!==null)v.currentTime=at;v.play().catch(()=>{});log('Playing the actual local media file. Audio is muted in the screen recording.');}
function pause(){document.querySelectorAll('video').forEach(v=>v.pause())}
function renderSource(mode){const active=mode==='context'?data.previousStart:start;const selected=data.lines.filter(x=>x.start>=data.previousStart-.1&&x.start<=end+.1);return `<h1>${mode==='context'?'Does the opening name its subject?':'Choose one complete idea.'}</h1><p class="sub">Original source: earlier owned narrated explainer · ${data.sourceSeconds.toFixed(1)} seconds</p><div class="workspace"><section><div class="player">${player('source.mp4')}</div><div class="controls"><button onclick="play('video',${active})">Play selection</button><button class="secondary" onclick="play('video',${end-4})">Check ending</button></div><div class="controls">In <input id="in" type="number" value="${start.toFixed(3)}" step="0.001"> Out <input id="out" type="number" value="${end.toFixed(3)}" step="0.001"><button class="secondary" onclick="setBounds()">Set boundaries</button></div></section><aside class="panel"><h2>Source transcript</h2>${selected.slice(0,5).map(x=>`<div class="row ${x.start>=start-.05?'selected':''}"><small>${x.start.toFixed(2)}–${x.end.toFixed(2)}s</small>${esc(x.text)}</div>`).join('')}</aside></div>`}
function renderCompare(mode){return `<h1>${mode==='crop'?'A center crop can lose the explanation.':mode==='reflow'?'Rebuild the layout for the frame.':'Same passage. Different framing.'}</h1><p class="sub">Actual exports from the same owned source; the repaired graphics are re-rendered vertically.</p><div class="twoup"><section><h2>Center crop</h2><div class="phone">${player('crop.mp4','before')}</div><p>Correct aspect ratio; source edges disappear.</p></section><section><h2>Vertical rebuild</h2><div class="phone">${player('reflow.mp4','after')}</div><p>Text is arranged inside the phone frame.</p></section></div><div class="controls" style="justify-content:center"><button onclick="play('before',0);play('after',0)">Play both exports</button><button class="secondary" onclick="pause()">Pause and inspect</button></div>`}
function renderCaptions(mode){return `<h1>${mode==='mute'?'Read it muted. Then verify the words.':'Verify words against the source.'}</h1><p class="sub">Actual subtitle file · spelling follows the original script, aligned to its narration.</p><div class="workspace"><section><div class="player">${player('reflow.mp4')}</div><div class="controls"><button onclick="play('video',0)">Play clip</button><button class="secondary" onclick="el('video').muted=!el('video').muted;log(el('video').muted?'Muted readability check':'Sound enabled for listening review')">Toggle sound</button></div></section><aside class="panel"><h2>Subtitle review</h2><textarea id="subtitles" spellcheck="false">${esc(data.srt.split('\n\n').slice(0,4).join('\n\n'))}</textarea><p class="help">Check names, numbers, negatives and timing. An SRT edit changes subtitles, not the spoken recording.</p><div class="controls"><button onclick="saveReview()">Save review note</button><a class="download" href="/media/captions.srt" download>Get SRT</a></div></aside></div>`}
function renderReport(){const m=data.report;return `<h1>Inspect the delivered file.</h1><p class="sub">Measured properties of reflow.mp4 · audience performance is unmeasured.</p><div class="workspace"><section><div class="player">${player('reflow.mp4')}</div><div class="controls"><button onclick="play('video',0)">Check opening</button><button class="secondary" onclick="play('video',${Math.max(0,data.clipSeconds-5)})">Check ending</button><a class="download" href="/media/reflow.mp4" download="owned-example-vertical-v1.mp4">Download video</a></div></section><aside class="panel"><h2>Actual file report</h2><div class="metric"><span>Canvas</span><strong>${m.width} × ${m.height}</strong></div><div class="metric"><span>Duration</span><strong>${data.clipSeconds.toFixed(2)}s</strong></div><div class="metric"><span>Video / audio</span><strong>${m.video} / ${m.audio}</strong></div><div class="metric"><span>Audio level</span><strong>${m.lufs} LUFS</strong></div><label class="check"><input type="checkbox" id="context"> Complete opening and ending</label><label class="check"><input type="checkbox" id="framing"> Important text stays visible</label><label class="check"><input type="checkbox" id="captions"> Captions visually reviewed</label><button onclick="saveReview()">Save review note</button></aside></div>`}
function renderEpisode(){return `<h1>Production pilot</h1><p class="sub">Full episode and derived Shorts · publication approval is pending.</p><div class="delivery"><section>${player('episode.mp4')}<p><a class="download" href="/media/episode.mp4" download>Download episode</a></p><div class="shorts">${[1,2,3,4].map(n=>`<section>${player('short-'+n+'.mp4','short'+n)}<p><a class="download" href="/media/short-${n}.mp4" download>Short ${n}</a></p></section>`).join('')}</div></section><aside class="panel"><h2>Review before publishing</h2><p class="help">Watch with sound. Check pronunciation, music balance, readable UI and captions. Technical checks do not establish audience engagement.</p><p class="help">The local app and its recordings are editable project assets. This is not a commercial clipping-service interface.</p></aside></div>`}
window.show=function(next){pause();view=next;const target=['compare','crop','reflow','result'].includes(next)?renderCompare(next):['captions','caption-check','mute'].includes(next)?renderCaptions(next):['report','export'].includes(next)?renderReport():next==='episode'?renderEpisode():renderSource(next);el('main').innerHTML=target;log('Viewing '+next+' · actual local files · no published performance claims.');return true};
window.setBounds=function(){const a=Number(el('in').value),b=Number(el('out').value);if(a>=0&&b>a&&b<=data.sourceSeconds){start=a;end=b;show('selection');log('Selection saved locally: '+a.toFixed(3)+'–'+b.toFixed(3)+' seconds. Prepared comparison exports use the documented example boundaries.')}else log('Choose valid boundaries within the source.')};
window.saveReview=async function(){const review={context:!!el('context')?.checked,framing:!!el('framing')?.checked,captions:!!el('captions')?.checked,view};if(el('subtitles'))review.subtitleText=el('subtitles').value+'\n\n'+data.srt.split('\n\n').slice(4).join('\n\n');const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(review)});log(r.ok?'Review note saved. Subtitle edits, when supplied, are saved in reviewed.srt. Publication approval is still pending.':'Review could not be saved.');return r.ok};
window.labAction=function(v){if(v===view&&document.querySelector('video')){document.querySelectorAll('video').forEach(x=>{if(x.paused&&!x.ended)x.play().catch(()=>{})});return true}if(v==='context')start=data.previousStart;else if(['selection','transcript','ending'].includes(v))start=data.start;show(v);if(['compare','crop','reflow','result'].includes(v)){play('before',0);play('after',0)}else if(['captions','caption-check','mute','export'].includes(v)){play('video',v==='export'?Math.max(0,data.clipSeconds-5):0)}else if(v==='report'){el('context').click();el('framing').click();el('captions').click();saveReview()}else play('video',v==='context'?data.previousStart:v==='ending'?end-4:start);return true};
fetch('/media/lab-data.json').then(r=>r.json()).then(d=>{data=d;start=d.start;end=d.end;show(new URLSearchParams(location.search).get('view')||'compare');window.labReady=true});if(innerWidth<1200)document.body.classList.add('portrait');
</script></body></html>
