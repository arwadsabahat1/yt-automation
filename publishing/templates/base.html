<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Studio{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0b10; --surface:#13131b; --surface-2:#1a1a24; --border:#252533; --border-2:#32324a;
    --text:#f1f1f5; --muted:#8a8aa0; --faint:#5d5d72;
    --accent:#ffd400; --accent-ink:#141414; --green:#34d399; --amber:#fbbf24; --red:#f87171; --blue:#60a5fa;
    --radius:12px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); }
  body { font:14px/1.55 Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; cursor:pointer; border:0; }

  .topbar { position:sticky; top:0; z-index:10; height:64px; padding:0 28px; display:flex; align-items:center; gap:28px;
            background:rgba(11,11,16,.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; letter-spacing:-.01em; }
  .brand .mark { width:28px; height:28px; border-radius:8px; background:var(--accent); display:grid; place-items:center; }
  .brand .mark::after { content:""; border-left:9px solid var(--accent-ink); border-top:6px solid transparent;
                        border-bottom:6px solid transparent; margin-left:3px; }
  .topbar .spacer { flex:1; }
  .stat { display:flex; align-items:baseline; gap:6px; color:var(--muted); font-size:13px; }
  .stat b { color:var(--text); font-size:16px; font-weight:700; }
  .stat.hot b { color:var(--accent); }

  .page { max-width:1180px; margin:0 auto; padding:28px; }

  .badge { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px; border-radius:99px;
           font-size:12px; font-weight:600; background:var(--surface-2); color:var(--muted); white-space:nowrap; }
  .badge::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .badge.pending { color:var(--accent); background:rgba(255,212,0,.1); }
  .badge.approved { color:var(--green); background:rgba(52,211,153,.1); }
  .badge.uploaded { color:var(--blue); background:rgba(96,165,250,.1); }
  .badge.rejected { color:var(--red); background:rgba(248,113,113,.1); }

  .btn { height:40px; padding:0 18px; border-radius:10px; font-weight:600; display:inline-flex; align-items:center;
         justify-content:center; gap:8px; transition:transform .05s, background .15s, opacity .15s; }
  .btn:active { transform:translateY(1px); }
  .btn-primary { background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover { background:#ffe14d; }
  .btn-ghost { background:var(--surface-2); color:var(--text); border:1px solid var(--border-2); }
  .btn-ghost:hover { background:#222230; }
  .btn-danger { background:transparent; color:var(--red); border:1px solid rgba(248,113,113,.35); }
  .btn-danger:hover { background:rgba(248,113,113,.08); }
  .btn:disabled { opacity:.35; cursor:not-allowed; }
  .btn-block { width:100%; height:46px; font-size:15px; }
  kbd { font:500 11px "JetBrains Mono", monospace; padding:1px 6px; border-radius:5px; background:var(--surface-2);
        border:1px solid var(--border-2); color:var(--muted); }
  .muted { color:var(--muted); } .ok { color:var(--green); } .warn { color:var(--amber); } .bad { color:var(--red); }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface-2);
           border:1px solid var(--border-2); padding:10px 16px; border-radius:10px; opacity:0; transition:opacity .2s;
           pointer-events:none; }
  .toast.show { opacity:1; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="topbar">
  <a class="brand" href="/"><span class="mark"></span>Studio</a>
  {% block nav %}{% endblock %}
  <div class="spacer"></div>
  {% if counts %}
  <div class="stat hot"><b>{{ counts.pending_rendered }}</b> to review</div>
  <div class="stat"><b>{{ counts.approved }}</b> to upload</div>
  <div class="stat"><b>{{ counts.uploaded }}</b> uploaded</div>
  {% endif %}
</div>
{% block body %}{% endblock %}
<div class="toast" id="toast"></div>
<script>
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
                      setTimeout(() => t.classList.remove("show"), 1800); }
async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) { const e = await r.json().catch(() => ({})); toast(e.detail || "Something went wrong"); return false; }
  return true;
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
